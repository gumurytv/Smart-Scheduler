# Android release: builds a signed AAB and uploads it to the Play Console closed test (Alpha).
# Run it from GitHub → Actions → "Android release" → Run workflow.
#
# One-time setup (repository Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks) as base64:  base64 -i upload-keystore.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD the key store password
#   ANDROID_KEY_ALIAS         the key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      the key password
#   PLAY_SERVICE_ACCOUNT_JSON the Google Play service account key (the whole JSON file)
#
# versionCode is 10 + the run number, so every run gets a new, higher number (the first run is 11).
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '버전 이름 (예: 1.3.0)'
        required: true
        default: '1.2.1'
      release_notes:
        description: '출시 노트 (테스터에게 보이는 「새로운 기능」, 500자 이내)'
        required: true
        default: '• 기능 개선과 오류 수정'
      track:
        description: '올릴 트랙 (alpha = 비공개 테스트, production = 정식 출시)'
        required: true
        default: alpha
        type: choice
        options: [alpha, internal, production]

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Version code
        run: echo "VERSION_CODE=$((10 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json is committed, so install from package.json.
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Release notes
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          printf '%s\n' "$NOTES" > whatsnew/whatsnew-ko-KR

      # Keep the AAB on the run page too, in case the upload step needs a retry by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: teumteum-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gumurytv.teumteum
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_CODE }} (${{ env.VERSION_NAME }})
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: whatsnew

      - name: Clean up the key
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
