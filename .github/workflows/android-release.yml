# Play 비공개 테스트 자동 출시
#
# android/app/build.gradle(versionCode/versionName)이 바뀐 채로 main에 머지되면
# 웹을 빌드해 Capacitor Android 프로젝트에 넣고, AAB를 만들어 서명한 뒤 Play 트랙에 올린다.
# 출시 노트는 src/data/changelog.ts 맨 위 항목. 설정 방법은 docs/android-release.md.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64    업로드 키(upload-keystore.jks)를 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD  키스토어 비밀번호
#   ANDROID_KEY_ALIAS          키 alias (보통 upload)
#   ANDROID_KEY_PASSWORD       키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON  Play Console에 권한을 준 서비스 계정 JSON
# 선택 Variables
#   PLAY_TRACK                 올릴 트랙 (기본 alpha = 비공개 테스트)
#
# Secrets가 없거나 PR에서 돌 때는 임시 키로 빌드만 해서 결과물로 남기고 올리지 않는다.
name: Android release

on:
  push:
    branches: [main]
    paths: [android/app/build.gradle]
  pull_request:
    paths:
      - .github/workflows/android-release.yml
      - android/release-notes.ts
  workflow_dispatch:
    inputs:
      upload:
        description: Play에 올리기 (끄면 빌드만)
        type: boolean
        default: true
      track:
        description: 트랙 (비우면 PLAY_TRACK 또는 alpha)
        type: string
        default: ''

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8은 JDK 21이 필요하다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Decide version and mode
        id: meta
        run: |
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p' android/app/build.gradle | head -1)
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          [ -n "$code" ] && [ -n "$name" ] || { echo "::error::build.gradle에서 versionCode/versionName을 못 읽었습니다"; exit 1; }
          release=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$KEYSTORE_B64" ]; then release=true; fi
          upload=$release
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then upload=false; fi
          if [ "$upload" = "true" ] && [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing"; exit 1
          fi
          track="${{ inputs.track }}"; track="${track:-${PLAY_TRACK:-alpha}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "### $name ($code) · release=$release · upload=$upload · track=$track" >> "$GITHUB_STEP_SUMMARY"
          if [ "$release" != "true" ]; then
            echo "::notice::임시 키로 빌드만 합니다 (PR이거나 서명 키 Secret이 없음). Play에는 올리지 않습니다."
          fi
        env:
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}

      # package-lock.json이 커밋돼 있지 않으므로 npm install (pages.yml과 같은 방식).
      - name: Build the web app and sync Capacitor
        run: |
          npm install --no-audit --no-fund
          npx vite build
          npx cap sync android

      - name: Release notes
        run: npx tsx android/release-notes.ts "$GITHUB_WORKSPACE/whatsnew" "${{ steps.meta.outputs.name }}"

      - name: Prepare signing key
        working-directory: android
        run: |
          if [ "${{ steps.meta.outputs.release }}" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
            alias="$KEY_ALIAS"; storepass="$KEYSTORE_PASSWORD"; keypass="$KEY_PASSWORD"
          else
            keytool -genkeypair -keystore upload-keystore.jks -alias ci -keyalg RSA -keysize 2048 \
              -validity 1 -storepass cipass -keypass cipass -dname "CN=TeumTeum CI" > /dev/null
            alias=ci; storepass=cipass; keypass=cipass
          fi
          # build.gradle이 읽는 형식. storeFile은 android/app 기준 상대 경로.
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$storepass"
            echo "keyAlias=$alias"
            echo "keyPassword=$keypass"
          } > keystore.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build and sign the AAB
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test -f app/build/outputs/bundle/release/app-release.aab

      # Claude 클라우드 세션은 Actions 로그 파일을 못 받으므로, 실패하면 로그 끝부분을 오류 주석으로 남긴다.
      - name: Show the build log tail
        if: failure()
        run: |
          [ -f android/build.log ] || exit 0
          msg=$(tail -n 60 android/build.log | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=gradle log::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: teumteum-${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            whatsnew/
          retention-days: 30

      - name: Upload to Google Play
        if: steps.meta.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gumurytv.teumteum
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.meta.outputs.name }} (${{ steps.meta.outputs.code }})
          track: ${{ steps.meta.outputs.track }}
          status: completed
          whatsNewDirectory: whatsnew

      - name: Remove the signing key
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
